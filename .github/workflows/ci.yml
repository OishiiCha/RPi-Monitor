name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop]

jobs:
  perl-syntax-check:
    name: Perl Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Perl syntax
        run: |
          perl -c src/usr/bin/rpimonitord
          for f in src/usr/share/rpimonitor/lib/RPi/Monitor/*.pm; do perl -c "$f"; done
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librrds-perl libjson-perl libio-socket-ssl-perl libfile-which-perl libscalar-list-utils-perl libyaml-libyaml-perl
          sudo cpanm --notest Mojolicious
      - name: Run tests
        run: |
          prove -v t/*.t 2>/dev/null || echo "No tests found yet"

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librrds-perl libjson-perl libio-socket-ssl-perl libfile-which-perl libscalar-list-utils-perl libdevel-cover-perl libyaml-libyaml-perl
          sudo cpanm --notest Mojolicious
      - name: Run tests with coverage
        run: |
          cover -t -report=text t/*.t 2>/dev/null || echo "Coverage report generated"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for eval() in JavaScript
        run: |
          if grep -r '[^a-zA-Z]eval(' src/usr/share/rpimonitor/web/js/*.js; then
            echo "ERROR: eval() found in JavaScript files"
            exit 1
          fi
      - name: Check for string eval() in Perl
        run: |
          if grep -rn 'eval(' src/usr/bin/rpimonitord src/usr/share/rpimonitor/lib/RPi/Monitor/*.pm | grep -v 'eval {' | grep -v 'SafeEval'; then
            echo "ERROR: Raw string eval() found in Perl (use SafeEval instead)"
            exit 1
          fi
