name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Perl dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librrds-perl libjson-perl libio-socket-ssl-perl libyaml-libyaml-perl
          sudo cpanm --notest Mojolicious

      - name: Run tests
        run: make test

      - name: Run syntax checks
        run: make check

      - name: Build distribution tarball
        run: make dist

      - name: Build .deb package
        run: make deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/rpimonitor-*.tar.gz
            dist/rpimonitor_*.deb
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
