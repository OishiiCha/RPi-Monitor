########################################################################
# Daemon configuration
#   Section 'daemon' is defining the behavior of rpimonitord.
########################################################################
#daemon.delay=10
#daemon.defaultinterval=1
#daemon.timeout=10
#daemon.noserver=0
#daemon.readonly=0
#daemon.addr=0.0.0.0
#daemon.port=8888
#daemon.user=pi
#daemon.group=pi
#daemon.webroot=/usr/share/rpimonitor/web
#daemon.datastore=/var/lib/rpimonitor
#daemon.logfile=/var/log/rpimonitor.log
#daemon.loglevel=0
########################################################################
# Authentication configuration
#   Set daemon.auth=1 to enable HTTP Basic Authentication
#   Configure username and password below.
########################################################################
#daemon.auth=0
#daemon.authuser=admin
#daemon.authpass=
#daemon.authrealm=RPi-Monitor
########################################################################
# SSL/TLS configuration
#   Set daemon.ssl=1 to enable HTTPS
#   Generate certificates with tools/make_cert.sh
########################################################################
#daemon.ssl=0
#daemon.sslcert=/etc/rpimonitor/cert.pem
#daemon.sslkey=/etc/rpimonitor/key.pem
########################################################################
# Testing mode configuration
#   Set daemon.testmode=1 to force testing mode banner display.
#   If not set, RPi-Monitor auto-detects: if not running on a
#   Raspberry Pi, testing mode is enabled automatically.
########################################################################
#daemon.testmode=0
